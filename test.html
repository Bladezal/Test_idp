    <!-- <script src="assets/jquery-3.3.1.min.js"></script> -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>

<body>
    <script>
        var user_object = {
            username: '',
            password: ''
        };
        var token_sess = sessionStorage.loginData;
        var url_login = "https://idp-monitoring.tbxapis.com/v1/user/login";
        var url_list = "https://idp-monitoring.tbxapis.com/v1/monitor/list";
        var url_lastAction = "https://idp-monitoring.tbxapis.com/v1/monitor/lastActions";
        var url_php_file = "db_save.php";
        var metodo = "POST";
        var data_type;

        var token;
        var list;
        var last_action;

        var request = function(url, metodo, data_object) {
            return $.ajax({
                url: url,
                method: metodo,
                data: data_object,
                dataType: "JSON",
                async: false,
                beforeSend: function(xhr) {
                    if (metodo === "GET") {
                        xhr.setRequestHeader("Authorization", "JWT " + token);
                    }
                }
            });
        }

        function getData() {
            request(url_list, "GET", null).done(function(data) {
                list = data;
            });
            request(url_lastAction, "GET", null).done(function(data) {
                last_action = data;
            });
            request(url_php_file, "POST", {
                option: "list",
                objectList: JSON.stringify(list)
            }).done(function(data) {
                alert("MSO List listo.");
            });
            request(url_php_file, "POST", {
                option: "last",
                objectList: JSON.stringify(last_action)
            }).done(function(data) {
                alert("Last action listo.");
            });
        }

        $(function() {
            $("#report").hide();
            $("#logueo").click(function() {
                user_object.username = $("#user").val();
                user_object.password = $("#pass").val();
                request(url_login, "POST", user_object).done(function(data) {
                    token = data.token;
                    $("#login").hide();
                    $("#report").show();
                    setTimeout(getData, (1000 * 60 * 60));
                });
            });

            $("#genReport").click(function() {
                request(url_php_file, "POST", {
                    option: "report",
                    objectList: JSON.stringify({
                        fecdesde: $("#fecdesde").val() + " " + $("#horadesde").val(),
                        fechasta: $("#fechasta").val() + " " + $("#horahasta").val()
                    })
                }).DONE(function(data) {

                })
            });
        });
    </script>
    <div class="row" id="login">
        <div class="col-md-4 col-md-offset-4">
            <div class="panel panel-primary">
                <div class="panel-heading">LOGIN</div>
                <div class="panel-body">
                    <form>
                        <div class="form-group">
                            <label for="user">Usuario</label>
                            <input type="text" class="form-control" id="user" placeholder="Usuario Toolbox">
                        </div>
                        <div class="form-group">
                            <label for="pass">Password</label>
                            <input type="password" class="form-control" id="pass" placeholder="Password" value="69U254o69cEI46G">
                        </div>
                        <button type="button" class="btn btn-primary" id="logueo">Log-In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div id="report">
            <div class="col-md-4 col-md-offset-4">
                <div class="panel panel-info">
                    <div class="panel-heading">Generar Reporte MSO</div>
                    <div class="panel-body">
                        <form class="form-inline">
                            <div class="form-group">
                                <label for="fecdesde">Fecha Desde: </label>
                                <input type="date" class="form-control" id="fecdesde">
                                <input type="time" class="form-control" id="horadesde">
                            </div>
                            <div class="form-group">
                                <label for="fechasta">Fecha Desde: </label>
                                <input type="date" class="form-control" id="fechasta">
                                <input type="time" class="form-control" id="horahasta">
                            </div>
                            <div class="col-md-4 col-md-offset-4">
                                <button type="button" class="btn btn-primary" id="genReport">Generar Reporte</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
